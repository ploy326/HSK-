  deck:[], pulled:0, poolSize:0, spinning:false, drawTicket:0, boardTicket:0, translating:new Map(),
  matchSize:6, board:[], selectedCN:null, selectedPY:null, matched:new Set(),
  mistakes:0, startTime:null, finishedAt:null, busy:false, timeTicker:null, resultMsg:''
};
const unique = list => [...new Set(list)];
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => {const b=[...a]; for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};
const escapeHTML = val => String(val).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = word => word.replace(/（[^）]*）|\([^)]*\)/g,'').replace('、','');
const overrides = {'得（助词）':'de','得（动词）':'dé','过（助词）':'guo','过（动词）':'guò','地（助词）':'de','地（名词）':'dì','等（动词）':'děng','等（助词）':'děng','对（介词）':'duì','对（形容词）':'duì','还（给）':'huán','长（大）':'zhǎng','花（动词）':'huā','这（这儿）':'zhè (zhèr)'};
const py = word => overrides[word] || pinyin(clean(word),{toneType:'symbol',type:'string'}).trim();
const vocab = lv => unique(WORDS_BY_LEVEL[lv]);
// Teacher-curated common senses. Other entries use clearly labelled machine translation.
const THAI_FIXED = {
'爱':'รัก','爸爸':'พ่อ','妈妈':'แม่','老师':'ครู','学生':'นักเรียน','学校':'โรงเรียน',
'朋友':'เพื่อน','你好':'สวัสดี','谢谢':'ขอบคุณ','再见':'ลาก่อน','对不起':'ขอโทษ',
'不客气':'ไม่เป็นไร','苹果':'แอปเปิล','水':'น้ำ','茶':'ชา','米饭':'ข้าวสวย',
'吃':'กิน','喝':'ดื่ม','天气':'สภาพอากาศ','下雨':'ฝนตก','下雪':'หิมะตก',
'冷':'หนาว','热':'ร้อน','汽车':'รถยนต์','出租车':'รถแท็กซี่','飞机':'เครื่องบิน',
'火车':'รถไฟ','学习':'เรียน','汉语':'ภาษาจีน','中文':'ภาษาจีน','中国':'ประเทศจีน',
'北京':'ปักกิ่ง','泰国':'ประเทศไทย','今天':'วันนี้','明天':'พรุ่งนี้',
'昨天':'เมื่อวาน','现在':'ตอนนี้','喜欢':'ชอบ','高兴':'ดีใจ','快乐':'มีความสุข',
'还（给）':'คืนให้','长（大）':'เติบโต','等（动词）':'รอ','等（助词）':'เป็นต้น',
'这（这儿）':'นี่ / ที่นี่','花（动词）':'ใช้จ่าย','过（助词）':'เคย',
'过（动词）':'ผ่าน','对（介词）':'ต่อ / กับ','对（形容词）':'ถูกต้อง',
'得（助词）':'คำช่วยเสริม','得（动词）':'ได้รับ','地（助词）':'คำช่วยขยายกริยา',
'地（名词）':'พื้นดิน'
};
const favKey = 'hsk_thai_cache_v2';
let savedTranslations = {};
try {savedTranslations = JSON.parse(localStorage.getItem(favKey) || '{}') || {}} catch {}
const translationCache = new Map([...Object.entries(savedTranslations), ...Object.entries(THAI_FIXED)]);
function storeThai(word, val){
  translationCache.set(word,val);
  try {const data=Object.fromEntries([...translationCache].slice(-800));localStorage.setItem(favKey,JSON.stringify(data))} catch {}
}
async function getThai(word){
  if(THAI_FIXED[word])return THAI_FIXED[word];
  if(translationCache.has(word))return translationCache.get(word);
  if(state.translating.has(word))return state.translating.get(word);
  const promise=fetch('https://hsk-1-6-vocab-playground.vercel.app/api/translate?word='+encodeURIComponent(word)).then(async response=>{
    if(!response.ok)throw new Error('service');
    const data=await response.json();if(!data.translation)throw new Error('empty');
    storeThai(word,data.translation);return data.translation;
  }).catch(()=>null).finally(()=>state.translating.delete(word));
  state.translating.set(word,promise);return promise;
}
function drawNewDeck(){state.deck=shuffle(vocab(state.level));state.pulled=0;state.poolSize=state.deck.length}
function resetDraw(){state.drawTicket++;state.current=null;state.spinning=false;drawNewDeck();render()}
function setLevel(lv){if(state.level===lv)return;state.drawTicket++;state.spinning=false;state.level=lv;state.current=null;state.busy=false;state.selectedCN=null;state.selectedPY=null;state.resultMsg='';drawNewDeck();newBoard();render()}
function setMode(mode){if(state.mode!==mode){state.drawTicket++;state.spinning=false;}state.mode=mode;state.resultMsg='';render()}
function formatNumber(n){return n.toLocaleString('zh-CN')}
function render(){
  document.title=`HSK ${state.level+1} · 汉语词汇游乐场`;
  app.innerHTML=`
    <div class="shell">
      <header class="masthead">
        <div class="brand"><div class="brand-icon">汉</div><div><span class="eyebrow">CHINESE WORD PLAYGROUND</span><h1>汉语词汇<span class="brand-alt">游乐场</span><span class="header-spark">✳</span></h1><div class="subhead">HSK 1—6 词汇游戏 · เกมคำศัพท์ภาษาจีน</div></div></div>
        <div class="header-note"><span class="chip-dot"></span> 全量词库 <strong>4,981</strong> 条 <span class="note-small">· 按上传Excel分级</span></div>
      </header>
      <div class="main-layout">
        <aside class="sidebar">
          <div class="sidebar-eyebrow">① 选择词汇等级 <small>เลือกระดับ</small></div>
          <div class="level-list">${LV.map((level,i)=>`<button class="level-btn ${i===state.level?'chosen':''}" style="--level:${gradeColors[i]}" data-level="${i}" aria-pressed="${i===state.level}"><span class="level-icon">${i+1}</span><span class="level-caption"><strong>HSK ${level}级</strong><small>${formatNumber(SOURCE_COUNTS[i])} 条词汇</small></span><span class="level-arrow">›</span></button>`).join('')}</div>
          <div class="source-foot">📘 词汇来源：Excel Sheet1<br/>📌 保留原表等级与原始词形<br/>🔁 抽题时自动避开同级重复词</div>
        </aside>
        <main class="workspace">
          <div class="topbar"><div class="current-level" style="--level:${gradeColors[state.level]}"><span class="dot"></span> 当前：HSK ${LV[state.level]}级 <span class="level-quantity">${formatNumber(SOURCE_COUNTS[state.level])} 条原表词汇</span></div><div class="mobile-scroll-hint">请选择游戏模式 ↓</div></div>
          <div class="game-tabs" role="tablist"><button class="mode-btn ${state.mode==='draw'?'active':''}" data-mode="draw" role="tab" aria-selected="${state.mode==='draw'}"><span>🎲</span><span><strong>随机抽词</strong><small>สุ่มคำศัพท์</small></span></button><button class="mode-btn ${state.mode==='match'?'active':''}" data-mode="match" role="tab" aria-selected="${state.mode==='match'}"><span>🧩</span><span><strong>拼音连连看</strong><small>จับคู่คำศัพท์กับพินอิน</small></span></button></div>
          ${state.mode==='draw'?renderDraw():renderMatch()}
          <p class="accuracy-note">注：已修正已知多音字；其余拼音仍需结合语境核对。常用泰语已加入固定译文，其余为机器翻译，建议教师复核。</p>
        </main>
      </div><footer class="footer">Made for Chinese classrooms · 为中文课堂而设计 <span>✺</span> 适配 iPad / 电脑 / 手机</footer>
    </div>`;
  bindEvents();
  if(state.mode==='draw' && state.current && state.showThai)updateDrawThai(state.current);
  if(state.mode==='match')refreshMatchedThai();
}
function renderDraw(){
  return `<section class="game-panel draw-panel">
    <div class="panel-title-row"><div><span class="step">GAME 01</span><h2>今天抽到哪个词？</h2><p class="hint">点击下方按钮，让词汇随机出现。<br class="for-mobile"/>抽词不会重复，直到抽完本级词汇。</p></div><div class="deco-stars">✦ ✳</div></div>
    <div class="switch-box"><span class="settings-title">显示设置 <small>ตั้งค่าการแสดงผล</small></span><label class="switch-wrap"><input id="toggle-pinyin" type="checkbox" ${state.showPinyin?'checked':''}/><span class="toggle"></span><span>显示拼音 <small>พินอิน</small></span></label><label class="switch-wrap"><input id="toggle-thai" type="checkbox" ${state.showThai?'checked':''}/><span class="toggle"></span><span>显示泰语 <small>ภาษาไทย</small></span></label></div>
    <div class="word-display" aria-live="polite"><div class="word-decor deco-top">✿</div><div class="word-decor deco-bottom">✧</div><div class="mini-label">YOUR WORD <span>·</span> HSK ${state.level+1}</div>${state.current?`<div class="hanzi ${state.spinning?'pulse':''}" id="draw-word">${escapeHTML(state.current)}</div>`:`<div class="word-placeholder"><span>?</span><p>准备好了吗？<small>พร้อมหรือยัง?</small></p></div>`}<div class="pinyin-output" id="draw-pinyin">${state.current&&state.showPinyin?escapeHTML(py(state.current)):'&nbsp;'}</div><div class="thai-output" id="draw-thai">${state.current&&state.showThai?'泰语翻译加载中… / กำลังแปล…':'&nbsp;'}</div></div>
    <div class="action-row"><button class="primary-action" id="draw-button" ${state.spinning?'disabled':''}><span>🎲</span> ${state.current?'再抽一个词':'开始随机抽词'} <span class="button-chev">›</span></button><button class="secondary-action" id="reshuffle-button" title="重置本级词库">↻ 重新洗牌</button><button class="speak-action" id="speak-button" ${state.current?'':'disabled'} title="朗读当前中文词汇">🔊</button></div>
    <div class="progress-panel"><div class="progress-caption"><span>本轮抽词进度</span><strong>${state.pulled} / ${state.poolSize}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${state.poolSize?100*state.pulled/state.poolSize:0}%"></div></div><p>抽完本级词汇后，会自动重新洗牌。共 ${formatNumber(SOURCE_COUNTS[state.level])} 条原始词汇（去重后 ${state.poolSize} 个）。</p></div>
  </section>`
}
function matchCard(word,side){
  const matched=state.matched.has(word),selected=side==='cn'?state.selectedCN===word:state.selectedPY===word;
  const label=side==='cn'?word:py(word);
  return `<button class="match-card ${matched?'matched':''} ${selected?'selected':''}" data-side="${side}" data-word="${escapeHTML(word)}" ${matched||state.busy?'disabled':''} aria-label="${escapeHTML(label)}"><span>${escapeHTML(label)}</span><span class="matched-check">✓</span></button>`;
}
function renderMatch(){
  const left=state.board.map(x=>x.word);
  const sortedRight=state.right;
  const total=state.board.length;
  const elapsed=state.startTime?Math.floor(((state.finishedAt||Date.now())-state.startTime)/1000):0;
  return `<section class="game-panel match-panel"><div class="panel-title-row"><div><span class="step">GAME 02</span><h2>找到它的拼音搭档！</h2><p class="hint">先点击中文，再点击对应拼音。配对成功后揭晓泰语意思。<br/>เลือกคำศัพท์ภาษาจีนแล้วจับคู่กับพินอินให้ถูกต้อง</p></div><div class="deco-stars">✦ ♡</div></div>
    <div class="match-toolbar"><div class="difficulty"><span>每轮题数</span>${[4,6,8].map(n=>`<button data-size="${n}" class="size-btn ${state.matchSize===n?'active':''}">${n}组</button>`).join('')}</div><button class="secondary-action match-new" id="new-board">↻ 换一组题目</button></div>
    <div class="score-strip"><div><span>✓ 已配对</span><strong id="matched-score">${state.matched.size} / ${total}</strong></div><div><span>◷ 用时</span><strong id="elapsed">${elapsed}s</strong></div><div><span>✕ 选错</span><strong id="mistake-count">${state.mistakes}</strong></div></div>
    <div class="matching-headings"><div>中文词语 <small>คำศัพท์ภาษาจีน</small></div><div>拼音 <small>พินอิน</small></div></div>
    <div class="match-columns"><div class="match-col" id="col-cn">${left.map(w=>matchCard(w,'cn')).join('')}</div><div class="match-col" id="col-py">${sortedRight.map(w=>matchCard(w,'py')).join('')}</div></div>
    <div class="match-message ${state.matched.size===total&&total>0?'winning':''}" id="match-msg" aria-live="polite">${state.matched.size===total&&total>0?'🎉 太棒了！全部配对成功！ เก่งมาก!':(state.resultMsg||'选择一张中文卡片，开始匹配吧！')}</div>
    <div class="answer-section"><div class="answer-title"><span>🏅 已解锁的词语</span><span>${state.matched.size}/${total}</span></div><div id="match-reveals" class="answer-list">${[...state.matched].map(w=>`<div class="answer-item"><span class="answer-cn">${escapeHTML(w)}</span><span class="answer-py">${escapeHTML(py(w))}</span><span class="answer-th" data-thaiword="${escapeHTML(w)}">${escapeHTML(translationCache.get(w)||'正在翻译…')}</span></div>`).join('')||'<div class="answer-empty">正确匹配后，词汇的泰语意思会出现在这里 ✨</div>'}</div></div>
  </section>`
}
function bindEvents(){
  document.querySelectorAll('[data-level]').forEach(el=>el.addEventListener('click',()=>setLevel(+el.dataset.level)));
  document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>setMode(el.dataset.mode)));
  if(state.mode==='draw'){
    document.getElementById('toggle-pinyin').addEventListener('change',e=>{state.showPinyin=e.target.checked;render()});
    document.getElementById('toggle-thai').addEventListener('change',e=>{state.showThai=e.target.checked;render()});
    document.getElementById('draw-button').addEventListener('click',doDraw);
    document.getElementById('reshuffle-button').addEventListener('click',resetDraw);
    document.getElementById('speak-button').addEventListener('click',speak);
  }else{
    document.querySelectorAll('[data-size]').forEach(el=>el.addEventListener('click',()=>{state.matchSize=+el.dataset.size;newBoard();render()}));
    document.getElementById('new-board').addEventListener('click',()=>{newBoard();render()});
    document.querySelectorAll('.match-card').forEach(el=>el.addEventListener('click',()=>pickCard(el.dataset.word,el.dataset.side)));
  }
}
function speak(){if(!state.current||!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(state.current));u.lang='zh-CN';u.rate=0.8;window.speechSynthesis.speak(u)}
async function doDraw(){
  if(state.spinning)return;
  if(!state.deck.length)drawNewDeck();
  state.spinning=true;
  const ticket=++state.drawTicket;
  const word=state.deck.pop();
  const el=document.getElementById('draw-word');
  const button=document.getElementById('draw-button');if(button)button.disabled=true;
  const flashWords=vocab(state.level);
  for(let i=0;i<9;i++){if(ticket!==state.drawTicket)return;const target=document.getElementById('draw-word')||document.querySelector('.word-placeholder');if(target){target.innerHTML=escapeHTML(flashWords[rnd(flashWords.length)]);target.classList.add('pulse')}await new Promise(r=>setTimeout(r,65+i*6))}
  if(ticket!==state.drawTicket)return;
  state.current=word;state.pulled++;state.spinning=false;render();
}
async function updateDrawThai(word){
  const box=document.getElementById('draw-thai');if(!box)return;
  const val=await getThai(word);if(state.mode==='draw'&&state.current===word&&state.showThai){const b=document.getElementById('draw-thai');if(b)b.textContent=val||'暂时无法翻译 · ลองใหม่อีกครั้ง';}
}
function newBoard(){
  state.boardTicket++;
  const pool=shuffle(vocab(state.level));const chosen=[];const seen=new Set();
  for(const word of pool){const phon=py(word).trim();if(!phon||seen.has(phon))continue;chosen.push(word);seen.add(phon);if(chosen.length===state.matchSize)break}
  const randomized=shuffle(chosen);
  state.board=randomized.map(word=>({word}));state.right=shuffle(randomized);
  state.matched=new Set();state.selectedCN=null;state.selectedPY=null;state.mistakes=0;state.startTime=null;state.finishedAt=null;state.resultMsg='';state.busy=false;
}
function pickCard(word,side){
  if(state.busy||state.matched.has(word))return;
  if(!state.startTime)state.startTime=Date.now();
  if(side==='cn')state.selectedCN=word;else state.selectedPY=word;
  const cn=state.selectedCN, pp=state.selectedPY;
  if(!cn||!pp){render();return}
  if(cn===pp){
    state.matched.add(cn);state.selectedCN=null;state.selectedPY=null;
    state.resultMsg=`🎉 ${cn} · ${py(cn)} ✓`;
    if(state.matched.size===state.board.length)state.finishedAt=Date.now();
    render();refreshMatchedThai();
  }else{
    state.mistakes++;state.busy=true;state.resultMsg='再试一次！ ลองอีกครั้ง!';render();
    document.querySelectorAll('.match-card.selected').forEach(el=>el.classList.add('wrong'));
    const ticket=state.boardTicket;
    setTimeout(()=>{if(ticket!==state.boardTicket)return;state.selectedCN=null;state.selectedPY=null;state.busy=false;render()},1100);
  }
}
async function refreshMatchedThai(){
  for(const word of state.matched){if(translationCache.has(word)){const span=[...document.querySelectorAll('[data-thaiword]')].find(n=>n.dataset.thaiword===word);if(span)span.textContent=translationCache.get(word);continue}
    getThai(word).then(translation=>{const span=[...document.querySelectorAll('[data-thaiword]')].find(n=>n.dataset.thaiword===word);if(span)span.textContent=translation||'暂时无法翻译';});
  }
}
setInterval(()=>{if(state.mode==='match'&&state.startTime&&!state.finishedAt){const clock=document.getElementById('elapsed');if(clock)clock.textContent=Math.floor((Date.now()-state.startTime)/1000)+'s'}},1000);
drawNewDeck();newBoard();render();

</script>
</body>
</html>
